[project]
name = "pypentair"
description = "Python package for interacting with Pentair Home devices over the cloud"
authors = [{ name = "Nathan Spencer", email = "natekspencer@gmail.com" }]
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
keywords = [
    "Pentair",
    "Pentair Home",
    "salt level sensor",
    "python",
]
dependencies = [
    "boto3>=1.27.1",
    "pycognito>=2023.5",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/natekspencer/pypentair"
Repository = "https://github.com/natekspencer/pypentair"

[dependency-groups]
dev = [
    "mypy>=1.18.2,<2.0",
    "pre-commit>=4.5.1",
    "pytest>=9.0,<10.0",
    "pytest-asyncio>=1.3.0,<2.0",
    "pytest-cov>=7.0,<8.0",
    "pytest-timeout>=2.1,<3",
    "ruff>=0.15.1",
    "tox>=4.32.0,<5.0",
]
demo = [
    "python-dotenv>=1.2.1,<2",
    "deepdiff>=6.3.1,<9.0.0",
]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.version]
path = "pypentair/__init__.py"
pattern = true

[tool.hatch.build.targets.sdist]
include = ["pypentair"]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.ruff.lint]
select = [
    "D", # pydocstyle
    "E", # pycodestyle Error
    "F", # Pyflakes
    "I", # isort
    "W", # pycodestyle Warning
]
ignore = [
    "D203", # 1 blank line required before class docstring
    "D213", # Multi-line docstring summary should start at the second line
    "E501", # Line too long
]

[tool.ruff.lint.isort]
combine-as-imports = true
split-on-trailing-comma = false

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true }}]
default-groups = [
    "dev",
    "demo",
]

[tool.uv-dynamic-versioning]
pattern = "default-unprefixed"
