[tox]
isolated_build = True
envlist = lint, mypy, py39, py310, py311, py312
skip_missing_interpreters = True

[tox:.package]
basepython = python3

[testenv]
allowlist_externals = uv
commands =
  uv run pytest --timeout=10 --cov=pypentair --cov-report=term-missing --asyncio-mode=auto

[testenv:lint]
ignore_errors = True
commands =
  uv run ruff check .
  uv run ruff format .

[testenv:mypy]
ignore_errors = True
commands =
  uv run mypy --install-types --non-interactive pypentair tests